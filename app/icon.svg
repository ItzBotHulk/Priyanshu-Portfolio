<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#190d33" />
      <stop offset="60%" stop-color="#0a0515" />
      <stop offset="100%" stop-color="#020105" />
    </radialGradient>
    
    <!-- Neon Purple Gradient for 'P' -->
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="30%" stop-color="#c084fc" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Accent Dot Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(192, 132, 252, 0.7)" />
      <stop offset="50%" stop-color="rgba(139, 92, 246, 0.25)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.08)" />
    </linearGradient>
  </defs>

  <!-- Container Box with Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14" />

  <!-- Ambient Purple Glow in Center -->
  <circle cx="240" cy="240" r="130" fill="#7c3aed" opacity="0.32" filter="url(#glow)" />

  <!-- Stylized Futuristic 'P' Monogram -->
  <g filter="url(#glow)">
    <!-- Stem of P -->
    <rect x="136" y="116" width="62" height="280" rx="31" fill="url(#pGrad)" />

    <!-- Outer Loop of P -->
    <path d="M176 116 H 280 C 354 116 404 160 404 228 C 404 296 354 340 280 340 H 176 V 282 H 272 C 318 282 344 258 344 228 C 344 198 318 174 272 174 H 176 Z" fill="url(#pGrad)" />

    <!-- Glowing Cyber Accent Orb -->
    <circle cx="360" cy="380" r="26" fill="url(#accentGrad)" />
  </g>
</svg>
